name: Build Pokémon Emerald

on:
  push:
    branches:
      - master
      - "lilycove/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile modern ROM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev

      - name: Compile
        run: make -j2 modern

      - name: Verify output exists
        run: test -s pokeemerald_modern.gba
