# Build Pokémon Emerald and validate Gen 8 staging structures.
name: Build Pokémon Emerald

on:
  push:
    branches:
      - master
      - "lilycove/**"
    paths-ignore:
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate data and compile modern ROM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi git libpng-dev python3

      - name: Generate Gen 8 National Dex manifest
        run: python3 tools/gen8_pokedex_manifest.py

      - name: Report Gen 8 import readiness (non-blocking until data migration)
        run: python3 tools/validate_gen8_pokedex.py --report-only

      - name: Audit CFRU-to-Emerald compatibility
        run: python3 tools/audit_gen8_import.py

      - name: Audit Gen 8 save and runtime storage architecture
        run: python3 tools/audit_gen8_runtime.py

      - name: Test Gen 8 Pokédex flag redundancy model
        run: python3 tools/test_gen8_pokedex_flag_model.py

      - name: Verify Gen 8 storage calculations
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open("reports/gen8-conversion/storage_architecture_audit.json", encoding="utf-8"))
          save = report["save_layout"]
          readiness = report["readiness"]
          assert save["national_dex_count"] == 898
          assert save["required_pokedex_flag_bytes_per_set"] == 113
          assert save["required_seen_owned_flag_bytes"] == 226
          assert save["required_total_redundant_flag_bytes"] == 452
          assert save["current_species_flag_bytes"] == 208
          assert save["additional_flag_bytes_needed"] == 244
          assert save["pokedex_struct_bytes"] == 0x78
          assert save["saveblock1_candidate_extension_capacity_bytes"] == 0x180
          assert save["saveblock1_bytes"] == 0x3D88
          assert save["saveblock2_bytes"] == 0xF2C
          assert save["saveblock2_headroom_bytes"] == 84
          assert save["saveblock2_expanded_pokedex_bytes"] == 4006
          assert save["saveblock2_expanded_headroom_bytes"] == -38
          assert save["saveblock2_fits_after_dex_expansion"] is False
          assert save["sector_data_bytes"] == 3968
          assert readiness["num_species_change_allowed"] is False
          assert readiness["save_extension_sector_plan_validated"] is False
          assert readiness["save_extension_read_write_tests"] is False
          assert readiness["runtime_ready"] is False
          print("PASS: save sector sizing verified; runtime/save migration remains blocked.")
          PY

      - name: Test Gen 8 SpeciesInfo parsers and source mappings
        run: python3 tools/test_gen8_species_info.py

      - name: Generate safe Gen 8 conversion package and C scaffolding
        run: python3 tools/gen8_convert_emerald.py

      - name: Test Gen 8 pending table parsers
        run: python3 tools/test_gen8_pending_tables.py

      - name: Generate comprehensive canonical Gen 8 source tables
        run: python3 tools/gen8_build_pending_tables.py

      - name: Verify generated staging sources are tracked and complete
        run: |
          test -s include/gen8_species_map.h
          test -s src/data/gen8/species_map.c
          test -s include/gen8_conversion_status.h
          test -s data/pokemon/gen8_species_map.json
          test -s data/pokemon/gen8_level_up_learnsets.json
          test -s data/pokemon/gen8_species_info_compact.json
          test -s data/pokemon/gen8_species_info_unresolved.json
          test -s data/pokemon/gen8_species_info_by_national_dex.json
          test -s reports/gen8-conversion/species_info_by_national_dex.json
          test -s reports/gen8-conversion/species_info_field_coverage.json
          test -s reports/gen8-conversion/emerald_species_info_compatibility.json
          test -s data/pokemon/gen8_species_evolutions.json
          test -s data/pokemon/gen8_species_pokedex_entries.json
          test -s data/pokemon/gen8_species_cry_map.json
          test -s data/pokemon/gen8_species_graphics_references.json
          test -s data/pokemon/gen8_species_form_references.json
          test -s data/pokemon/gen8_species_level_up_learnsets.json
          test -s data/pokemon/gen8_move_source_catalog.json
          test -s data/pokemon/gen8_contest_effect_source_catalog.json
          test -s data/pokemon/gen8_ability_source_dependencies.json
          test -s data/pokemon/gen8_item_source_dependencies.json
          test -s data/pokemon/gen8_type_source_dependencies.json
          test -s data/pokemon/gen8_egg_group_source_dependencies.json
          test -s data/pokemon/gen8_growth_rate_source_dependencies.json
          test -s data/pokemon/gen8_evolution_method_dependencies.json
          test -s data/pokemon/gen8_evolution_condition_dependencies.json
          test -s data/pokemon/gen8_pokedex_orders.json
          test -s reports/gen8-conversion/pending_species_tables_audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = [
              "include/gen8_species_map.h",
              "src/data/gen8/species_map.c",
              "include/gen8_conversion_status.h",
              "data/pokemon/gen8_species_map.json",
              "data/pokemon/gen8_level_up_learnsets.json",
              "data/pokemon/gen8_species_info_compact.json",
              "data/pokemon/gen8_species_info_unresolved.json",
              "data/pokemon/gen8_species_info_by_national_dex.json",
              "reports/gen8-conversion/species_info_by_national_dex.json",
              "reports/gen8-conversion/species_info_field_coverage.json",
              "reports/gen8-conversion/emerald_species_info_compatibility.json",
              "data/pokemon/gen8_species_evolutions.json",
              "data/pokemon/gen8_species_pokedex_entries.json",
              "data/pokemon/gen8_species_cry_map.json",
              "data/pokemon/gen8_species_graphics_references.json",
              "data/pokemon/gen8_species_form_references.json",
              "data/pokemon/gen8_species_level_up_learnsets.json",
              "data/pokemon/gen8_move_source_catalog.json",
              "data/pokemon/gen8_contest_effect_source_catalog.json",
              "data/pokemon/gen8_ability_source_dependencies.json",
              "data/pokemon/gen8_item_source_dependencies.json",
              "data/pokemon/gen8_type_source_dependencies.json",
              "data/pokemon/gen8_egg_group_source_dependencies.json",
              "data/pokemon/gen8_growth_rate_source_dependencies.json",
              "data/pokemon/gen8_evolution_method_dependencies.json",
              "data/pokemon/gen8_evolution_condition_dependencies.json",
              "data/pokemon/gen8_pokedex_orders.json",
              "reports/gen8-conversion/pending_species_tables_audit.json",
          ]
          missing = [p for p in expected if not Path(p).is_file() or Path(p).stat().st_size == 0]
          assert not missing, f"Missing or empty generated files: {missing}"
          pending = json.load(open("reports/gen8-conversion/pending_species_tables_audit.json", encoding="utf-8"))
          assert pending["counts"]["canonical_species"] == 898
          assert pending["readiness"]["898_canonical_species_rows"] is True
          assert pending["readiness"]["898_gen8_level_up_learnsets"] is True
          assert pending["readiness"]["all_present_evolution_expressions_parsed"] is True
          assert pending["counts"]["canonical_conditional_evolution_edges"] > 0
          assert pending["counts"]["distinct_evolution_condition_symbols"] > 0
          assert pending["counts"]["evolution_conditions_with_candidate_target_methods"] > 0
          assert pending["counts"]["canonical_evolution_methods_requiring_new_handlers"] >= 1
          assert pending["counts"]["unknown_evolution_target_symbols"] == 0
          assert pending["readiness"]["898_pokedex_text_rows"] is True
          assert pending["counts"]["pokedex_text_rows_with_decoded_description"] == 898
          assert pending["counts"]["unresolved_pokedex_text_rows"] == 0
          assert pending["readiness"]["898_cry_identifiers_mapped_to_source_table"] is True
          assert pending["counts"]["cry_rows_matching_emerald_table"] + pending["counts"]["missing_emerald_cry_table_matches"] == 898
          assert pending["counts"]["target_graphics_asset_complete_rows"] + pending["counts"]["target_graphics_asset_incomplete_rows"] == 898
          assert pending["counts"]["target_graphics_asset_incomplete_rows"] == len(pending["missing_target_graphics_assets"])
          assert pending["readiness"]["898_graphics_reference_rows"] is True
          assert pending["readiness"]["all_referenced_form_tables_found"] is True
          assert pending["readiness"]["all_three_pokedex_orders_cover_gen8"] is True
          assert pending["readiness"]["all_source_move_info_rows_found"] is True
          assert pending["counts"]["canonical_gen8_learnset_moves_missing_target_battle_records"] >= 0
          assert pending["counts"]["canonical_gen8_learnset_moves_missing_target_contest_records"] >= 0
          assert pending["counts"]["canonical_types_without_emerald_definition"] == 2
          assert pending["counts"]["canonical_types_missing_emerald_definition_symbols"] == ["FAIRY", "STELLAR"]
          assert pending["counts"]["canonical_egg_groups_without_emerald_definition"] == 0
          assert pending["counts"]["canonical_growth_rates_without_emerald_definition"] == 0
          assert pending["readiness"]["num_species_change_allowed"] is False
          assert all(value is False for key, value in pending["readiness"].items() if key.startswith("runtime_"))
          report = json.load(open("reports/gen8-conversion/conversion_report.json", encoding="utf-8"))
          assert report["counts"]["canonical_dex_entries"] == 898
          assert report["counts"]["existing_species"] == 386
          assert report["counts"]["new_species"] == 512
          assert report["counts"]["canonical_species_info_covered"] == 898
          assert report["counts"]["canonical_species_info_missing"] == 0
          assert report["counts"]["canonical_species_info_native_emerald_preserved_rows"] == 386
          assert report["counts"]["canonical_species_info_expansion_source_rows"] == 512
          assert (report["counts"]["canonical_species_info_native_emerald_preserved_rows"] + report["counts"]["canonical_species_info_expansion_source_rows"]) == 898
          assert report["readiness"]["species_info_zero_missing_canonical_entries"] is True
          # Source-field completeness and runtime compatibility are separate,
          # non-blocking audit gates until their explicit mappings are closed.
          # Keep all unresolved fields in the uploaded report; never hide them
          # behind a false-positive full-readiness assertion.
          assert report["counts"]["canonical_species_info_source_missing_fields"] == 0
          assert report["counts"]["canonical_species_info_source_unresolved_fields"] == 0
          assert report["counts"]["canonical_species_info_runtime_gap_records"] >= 0
          assert report["counts"]["canonical_species_info_source_complete_rows"] == 898
          assert report["counts"]["canonical_species_info_source_fields_resolved_rows"] == 512
          assert report["counts"]["canonical_species_info_compact_compatible_rows"] <= 898
          assert report["counts"]["canonical_species_info_target_mapping_compatible_rows"] <= 898
          assert report["counts"]["canonical_species_info_compatibility_issue_records"] >= 0
          assert report["counts"]["missing_species_info_for_new_dex_species"] == 0
          assert report["readiness"]["new_species_ids_allocated"] is False
          assert report["readiness"]["runtime_ready"] is False
          assert report["readiness"]["species_info_source_fields_complete"] == (
              report["counts"]["canonical_species_info_covered"] == 898
              and report["counts"]["canonical_species_info_missing"] == 0
              and report["counts"]["canonical_species_info_source_complete_rows"] == 898
              and report["counts"]["canonical_species_info_source_missing_fields"] == 0
              and report["counts"]["canonical_species_info_source_unresolved_fields"] == 0
              and report["counts"]["canonical_species_info_source_fields_resolved_rows"] == 898
          )
          print("PASS: 898 canonical identities covered; source-field and runtime gaps remain explicitly audited.")
          PY


      - name: Correct Route 121 vertical fence tiles
        run: python3 tools/fix_route121_fence.py

      - name: Compile
        run: make -j2 modern

      - name: Verify output exists
        run: test -s pokeemerald_modern.gba

      - name: Upload ROM for testing
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-modern-rom
          path: pokeemerald_modern.gba
          if-no-files-found: error
          retention-days: 90

      - name: Upload Gen 8 conversion reports
        uses: actions/upload-artifact@v4
        with:
          name: gen8-conversion-report
          path: |
            reports/gen8-conversion/
            data/pokemon/gen8_species_evolutions.json
            data/pokemon/gen8_species_pokedex_entries.json
            data/pokemon/gen8_species_cry_map.json
            data/pokemon/gen8_species_graphics_references.json
            data/pokemon/gen8_species_form_references.json
            data/pokemon/gen8_species_level_up_learnsets.json
            data/pokemon/gen8_move_source_catalog.json
            data/pokemon/gen8_contest_effect_source_catalog.json
            data/pokemon/gen8_ability_source_dependencies.json
            data/pokemon/gen8_item_source_dependencies.json
            data/pokemon/gen8_type_source_dependencies.json
            data/pokemon/gen8_egg_group_source_dependencies.json
            data/pokemon/gen8_growth_rate_source_dependencies.json
            data/pokemon/gen8_evolution_method_dependencies.json
            data/pokemon/gen8_evolution_condition_dependencies.json
            data/pokemon/gen8_pokedex_orders.json
          if-no-files-found: error
          retention-days: 90
