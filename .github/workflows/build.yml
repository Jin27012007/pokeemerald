# Rebuild after fixing Lilycove upstairs script inclusion
# Rebuild trigger for final Lilycove arrival-scene ROM.
name: Build Pokémon Emerald
# Triggered builds compile the exact branch commit for ROM testing.

on:
  push:
    branches:
      - master
      - "lilycove/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile modern ROM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if command -v arm-none-eabi-gcc >/dev/null 2>&1 && command -v arm-none-eabi-as >/dev/null 2>&1 && command -v make >/dev/null 2>&1 && pkg-config --exists libpng; then
            echo "Required build tools are already installed on the runner."
          else
            sudo timeout 90s apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 || true
            sudo timeout 240s apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi git libpng-dev
          fi

      - name: Correct Route 121 vertical fence tiles
        run: python3 tools/fix_route121_fence.py

      - name: Compile
        run: make -j2 modern

      - name: Verify output exists
        run: test -s pokeemerald_modern.gba

      - name: Upload ROM for testing
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-modern-rom
          path: pokeemerald_modern.gba
          if-no-files-found: error
          retention-days: 90

# Rebuild exact commit after Route 121 landscape changes.
