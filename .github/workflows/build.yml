name: Build Pokémon Emerald
# Triggered builds compile the exact branch commit for ROM testing.

on:
  push:
    branches:
      - master
      - "lilycove/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile modern ROM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi git libpng-dev

      - name: Compile
        run: make -j2 modern

      - name: Verify output exists
        run: test -s pokeemerald_modern.gba

      - name: Upload ROM for testing
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-modern-rom
          path: pokeemerald_modern.gba
          if-no-files-found: error
          retention-days: 90
