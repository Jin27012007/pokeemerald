name: Preview Route 121 fence metatiles
on:
  push:
    branches:
      - inspect/route121-fence-candidates
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render candidate metatiles
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import struct
          from PIL import Image, ImageDraw, ImageFont

          root = Path(".")
          pbase = root / "data/tilesets/primary/general"
          sbase = root / "data/tilesets/secondary/lilycove"
          ptiles = Image.open(pbase / "tiles.png").convert("P")
          stiles = Image.open(sbase / "tiles.png").convert("P")

          def read_palettes(folder):
              out = {}
              for p in folder.glob("*.pal"):
                  lines = p.read_text().splitlines()[3:]
                  try:
                      out[int(p.stem)] = [tuple(map(int, ln.split())) for ln in lines if ln.strip()]
                  except Exception:
                      pass
              return out

          ppals = read_palettes(pbase / "palettes")
          spals = read_palettes(sbase / "palettes")
          pmeta = (pbase / "metatiles.bin").read_bytes()
          smeta = (sbase / "metatiles.bin").read_bytes()
          pattrs = (pbase / "metatile_attributes.bin").read_bytes()
          satts = (sbase / "metatile_attributes.bin").read_bytes()

          def palette(folder_pal, n):
              return folder_pal.get(n, [(0,0,0)]*16)

          def tile_pixels(sheet, tile_id):
              tid = tile_id if tile_id < 512 else tile_id - 512
              x = (tid % 16) * 8
              y = (tid // 16) * 8
              if x + 8 > sheet.width or y + 8 > sheet.height:
                  return Image.new("RGBA", (8,8), (255,0,255,255))
              return sheet.crop((x,y,x+8,y+8))

          def metatile(global_id):
              secondary = global_id >= 512
              local = global_id - 512 if secondary else global_id
              data = smeta if secondary else pmeta
              image = Image.new("RGBA", (16,16), (0,0,0,0))
              for layer in range(2):
                  for n in range(4):
                      i = local*16 + (layer*4+n)*2
                      w = struct.unpack_from("<H", data, i)[0]
                      tid = w & 1023
                      pal = (w >> 12) & 15
                      hf = bool(w & 0x400)
                      vf = bool(w & 0x800)
                      if tid == 0:
                          continue
                      tile_is_secondary = tid >= 512
                      source_sheet = stiles if tile_is_secondary else ptiles
                      source_palettes = spals if tile_is_secondary else ppals
                      raw = tile_pixels(source_sheet, tid)
                      if raw.mode != "P":
                          out = raw.convert("RGBA")
                      else:
                          colors = palette(source_palettes, pal)
                          pix = raw.load()
                          out = Image.new("RGBA", (8,8), (0,0,0,0))
                          op = out.load()
                          for yy in range(8):
                              for xx in range(8):
                                  idx = pix[xx, yy]
                                  if isinstance(idx, tuple):
                                      raise RuntimeError(f"Unexpected pixel tuple for metatile {global_id}, tile {tid}: {idx}")
                                  if idx < len(colors):
                                      r,g,b = colors[idx]
                                      op[xx,yy] = (r,g,b,255 if idx else 0)
                      if hf: out = out.transpose(Image.Transpose.FLIP_LEFT_RIGHT)
                      if vf: out = out.transpose(Image.Transpose.FLIP_TOP_BOTTOM)
                      x = (n%2)*8
                      y = (n//2)*8
                      if layer == 0:
                          image.alpha_composite(out,(x,y))
                      else:
                          image.alpha_composite(out,(x,y))
              return image

          ids = list(range(536, 585)) + list(range(800, 862))
          # Add the exact tree-leaf fragments and their surrounding IDs from the primary set.
          ids += [4, 14, 37, 38, 39, 121, 124, 125, 145, 260, 261, 454, 455, 462, 463]
          ids = list(dict.fromkeys(ids))
          cols, cellw, cellh, scale = 8, 64, 54, 3
          rows = (len(ids)+cols-1)//cols
          sheet_out = Image.new("RGB",(cols*cellw,rows*cellh),(232,239,230))
          draw = ImageDraw.Draw(sheet_out)
          for k, mid in enumerate(ids):
              x=(k%cols)*cellw
              y=(k//cols)*cellh
              draw.text((x+2,y+1),str(mid),fill=(20,30,20))
              im=metatile(mid).resize((16*scale,16*scale),Image.Resampling.NEAREST)
              sheet_out.paste(im,(x+4,y+11),im)
              draw.rectangle((x,y,x+cellw-1,y+cellh-1),outline=(135,155,135))
          sheet_out.save("/tmp/route121-metatiles.png")

          # Tile-level atlas: this exposes alternate vertical posts or fence pieces
          # that may be reused to build a matching orientation.
          def tile_atlas(pal_id):
              colors = palette(spals, pal_id)
              cellw, cellh, scale, cols = 40, 42, 4, 16
              rows = 32
              canvas = Image.new("RGB", (cols*cellw, rows*cellh), (234,239,232))
              dr = ImageDraw.Draw(canvas)
              for tid in range(512):
                  x=(tid%cols)*cellw
                  y=(tid//cols)*cellh
                  sx=(tid%16)*8
                  sy=(tid//16)*8
                  raw=stiles.crop((sx,sy,sx+8,sy+8)).convert("P")
                  pix=raw.load()
                  tile=Image.new("RGBA",(8,8),(0,0,0,0))
                  tp=tile.load()
                  for yy in range(8):
                      for xx in range(8):
                          idx=pix[xx,yy]
                          if idx and idx < len(colors):
                              r,g,b=colors[idx]
                              tp[xx,yy]=(r,g,b,255)
                  tile=tile.resize((8*scale,8*scale),Image.Resampling.NEAREST)
                  canvas.paste(tile,(x+4,y+12),tile)
                  dr.text((x+2,y+1),str(tid+512),fill=(20,30,20))
                  dr.rectangle((x,y,x+cellw-1,y+cellh-1),outline=(135,155,135))
              return canvas

          tile_atlas(8).save("/tmp/route121-secondary-tiles-p8.png")
          tile_atlas(9).save("/tmp/route121-secondary-tiles-p9.png")

          # Test arrangements of existing blue fence component tiles as a vertical post.
          def render_one(global_tid, pal_id):
              secondary = global_tid >= 512
              sheet = stiles if secondary else ptiles
              pset = spals if secondary else ppals
              raw = tile_pixels(sheet, global_tid)
              if raw.mode != "P":
                  return raw.convert("RGBA")
              colors = palette(pset, pal_id)
              src = raw.load()
              out = Image.new("RGBA", (8,8), (0,0,0,0))
              dst = out.load()
              for yy in range(8):
                  for xx in range(8):
                      idx = src[xx,yy]
                      if idx and idx < len(colors):
                          r,g,b=colors[idx]
                          dst[xx,yy]=(r,g,b,255)
              return out

          candidates = [
              ("HORIZONTAL_REF", [839,867,855,883]),
              ("A", [867,868,870,871]),
              ("B", [867,870,871,872]),
              ("C", [868,869,871,872]),
              ("D", [870,871,872,883]),
              ("E", [867,870,883,872]),
              ("F", [867,868,871,872]),
              ("G", [868,870,871,883]),
              ("H", [870,871,886,887]),
              ("I", [839,867,871,872]),
              ("J", [867,870,855,883]),
              ("K", [868,869,870,871]),
              ("L", [870,883,871,855]),
              ("M", [870,0,871,0]),
              ("N", [868,0,871,0]),
              ("O", [867,0,870,0]),
              ("P", [867,0,871,0]),
              ("Q", [868,870,871,0]),
              ("R", [868,0,871,883]),
              ("S", [870,883,871,0]),
              ("T", [867,870,871,0]),
          ]
          cols, cellw, cellh, scale = 5, 112, 112, 5
          canvas = Image.new("RGB",(cols*cellw,((len(candidates)+cols-1)//cols)*cellh),(232,239,230))
          dr = ImageDraw.Draw(canvas)
          base_ids = [3,2,2,3]
          for k,(name,overlay_ids) in enumerate(candidates):
              x=(k%cols)*cellw; y=(k//cols)*cellh
              tile = Image.new("RGBA",(16,16),(0,0,0,0))
              # Base grass layer.
              for n,tid in enumerate(base_ids):
                  t=render_one(tid,2)
                  tile.alpha_composite(t,((n%2)*8,(n//2)*8))
              # Fence overlay (palette 8).
              for n,tid in enumerate(overlay_ids):
                  t=render_one(tid,8)
                  tile.alpha_composite(t,((n%2)*8,(n//2)*8))
              enlarged=tile.resize((16*scale,16*scale),Image.Resampling.NEAREST)
              canvas.paste(enlarged,(x+12,y+22),enlarged)
              dr.text((x+2,y+2),name+" "+str(overlay_ids),fill=(15,25,15))
              dr.rectangle((x,y,x+cellw-1,y+cellh-1),outline=(135,155,135))
          canvas.save("/tmp/route121-vertical-candidates.png")
          print("wrote",len(ids),"metatiles, tile atlases, and vertical candidates")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: route121-metatile-preview
          path: |
            /tmp/route121-metatiles.png
            /tmp/route121-secondary-tiles-p8.png
            /tmp/route121-secondary-tiles-p9.png
            /tmp/route121-vertical-candidates.png
          retention-days: 1
