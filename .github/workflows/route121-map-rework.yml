name: Rework Route 121 landscape

on:
  push:
    branches:
      - lilycove/development
    paths:
      - .github/workflows/route121-map-rework.yml

permissions:
  contents: write

jobs:
  rework-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lilycove/development
      - name: Open the maze and remove tall grass
        run: |
          python3 - <<'PY'
          import collections
          import struct
          from pathlib import Path

          path = Path("data/layouts/Route121/map.bin")
          raw = path.read_bytes()
          if len(raw) != 80 * 20 * 2:
              raise SystemExit(f"Unexpected Route 121 map size: {len(raw)} bytes")

          blocks = list(struct.unpack("<1600H", raw))
          fence_ids = {0x250, 0x251, 0x252, 0x258, 0x25A}
          before = collections.Counter(v & 0x3FF for v in blocks)
          tall_grass_changed = 0
          fence_changed = 0

          for i, value in enumerate(blocks):
              metatile = value & 0x3FF
              elevation = value & 0xF000
              if metatile == 0x00D:
                  # Keep elevation, clear forced collision, replace tall grass with normal grass.
                  blocks[i] = elevation | 0x001
                  tall_grass_changed += 1
              elif metatile in fence_ids:
                  # Remove the maze rails and leave a walkable grass floor.
                  blocks[i] = elevation | 0x001
                  fence_changed += 1

          # Existing General_Grass and General_Grass detail tiles are traversable.
          # Place modest flower patches on the edges of the opened route, never over warps/items/NPCs.
          flowers = [
              (34, 6), (35, 6), (40, 6),
              (35, 7), (36, 7), (40, 7),
              (45, 8), (53, 8), (54, 8),
              (62, 8), (63, 8),
              (43, 10), (53, 10),
              (62, 11), (71, 11),
              (72, 10), (73, 10), (75, 12),
          ]
          object_positions = {
              (29, 14), (14, 2), (15, 2), (16, 2), (17, 2),
              (64, 14), (65, 14), (66, 14), (67, 14),
              (55, 10), (60, 10), (38, 13), (37, 5)
          }
          flower_count = 0
          for x, y in flowers:
              i = y * 80 + x
              value = blocks[i]
              metatile = value & 0x3FF
              if (x, y) in object_positions:
                  continue
              if metatile == 0x001:
                  blocks[i] = (value & 0xF000) | 0x004
                  flower_count += 1

          path.write_bytes(struct.pack("<1600H", *blocks))
          after = collections.Counter(v & 0x3FF for v in blocks)
          assert after[0x00D] == 0, "Tall grass still remains in Route 121"
          assert all((v & 0x3FF) not in fence_ids for v in blocks), "Fence maze tiles remain"
          print(f"Map bytes: {len(raw)}")
          print(f"Tall grass converted: {tall_grass_changed}")
          print(f"Fence/rail blocks removed: {fence_changed}")
          print(f"Flower patches placed: {flower_count}")
          print(f"Before tall grass: {before[0x00D]}; after tall grass: {after[0x00D]}")
          print(f"After grass: {after[0x001]}; after flower tile: {after[0x004]}")
          PY
      - name: Commit the edited binary map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/layouts/Route121/map.bin
          git commit -m "Remove Route 121 tall grass and maze rails"
          git push origin HEAD:lilycove/development
